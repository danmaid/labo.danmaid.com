<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="css/full-screen.css">
  <script type="module" src="http://localhost:8080/dm-ssh-terminal.mjs"></script>
</head>

<body class="full-screen" style="padding: 8px; overflow: hidden;">
  <dm-ssh-terminal>
    <script>
      const terminal = document.currentScript.parentElement
      const params = new URLSearchParams(location.search)
      for (const k of ['socket', 'session', 'role', 'host', 'broker']) {
        for (const v of params.getAll(k)) {
          v === '' ? terminal.toggleAttribute(k, true) : terminal.setAttribute(k, v)
        }
      }
    </script>
  </dm-ssh-terminal>
</body>

</html>
