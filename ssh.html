<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="css/full-screen.css">
</head>

<body class="full-screen" style="padding: 8px; overflow: hidden;">
  <dm-ssh-terminal host="nanopi-r1.local"></dm-ssh-terminal>
  <!-- 
  <dm-ssh-terminal>  (Web Component)
        │
        ├─ TerminalView        (xterm.js + addon-fit)
        ├─ SessionClient       (REST: /sessions)
        ├─ AttachConnection    (WebSocket attach)
        └─ LoginController     (テキストログインUI)
  依存の向きは一方向にします：
  WebComponent
    → LoginController
    → SessionClient
    → AttachConnection
    → TerminalView

  xterm.js は 一番末端です。
   -->
  <script type="module">
    // import { Terminal } from "xterm"
    // import { FitAddon } from "xterm-fit"
    // const cssUrl = new URL("./xterm.css", import.meta.url)
    import { Terminal } from "https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.mjs"
    import { FitAddon } from "https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/lib/addon-fit.mjs"
    const cssUrl = "https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css"
    const cssText = await fetch(cssUrl).then(r => r.text())

    const xtermCss = new CSSStyleSheet()
    await xtermCss.replace(cssText)

    const defaultCss = new CSSStyleSheet()
    await defaultCss.insertRule(`
      :host, .container {
        display: block;
        width: 100%;
        height: 100%;
      }`)

    class DmSshTerminal extends HTMLElement {
      static get observedAttributes() { return ["url"] }

      constructor() {
        super()
        this.attachShadow({ mode: "open" })
        this.shadowRoot.adoptedStyleSheets = [...this.shadowRoot.adoptedStyleSheets, xtermCss, defaultCss]
      }

      connectedCallback() {
        this.view = new TerminalView(this.shadowRoot)

        if (this.hasAttribute("url")) {
          this.attach(this.getAttribute("url"))
        } else {
          this.login = new LoginController(this.view, creds =>
            this.createSession(creds)
          )
          this.login.start()
        }
      }

      attributeChangedCallback(name, oldVal, newVal) {
        if (name === "url" && newVal && newVal !== oldVal) {
          this.attach(newVal)
        }
      }

      async createSession({ username, password }) {
        const client = new SessionClient()
        const { writer_ws_url } =
          await client.createSession({
            host: this.getAttribute("host"),
            port: this.getAttribute("port"),
            username,
            password,
            pty: this.view.getSize(),
          })

        this.setAttribute("url", writer_ws_url) // ← 状態遷移の要
      }

      attach(url) {
        this.attachConn?.close()
        this.attachConn = new AttachConnection(url, {
          onData: data => this.view.write(data),
        })

        this.view.onInput(data => this.attachConn.send(data))
        this.attachConn.open()
      }
    }

    class TerminalView {
      constructor(root) {
        const container = document.createElement("div")
        container.className = "container"
        root.appendChild(container)

        this.term = new Terminal({
          cursorBlink: true,
          scrollback: 3000,
        })
        this.fit = new FitAddon()

        this.term.loadAddon(this.fit)
        this.term.open(container)
        this.fit.fit()

        new ResizeObserver(() => this.fit.fit()).observe(container)
      }

      write(data) {
        this.term.write(data)
      }

      onInput(cb) {
        this._inputDisposable?.dispose()
        this._inputDisposable = this.term.onData(cb)
      }

      getSize() {
        return { cols: this.term.cols, rows: this.term.rows }
      }
    }

    class SessionClient {
      async createSession(req) {
        const res = await fetch("http://localhost:8080/sessions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer dev-token", // MVP
          },
          body: JSON.stringify({
            host: req.host,
            port: req.port ?? 22,
            username: req.username,
            password: req.password,
            pty_cols: req.pty?.cols,
            pty_rows: req.pty?.rows,
          }),
        })

        if (!res.ok) {
          const err = await res.json()
          throw { status: res.status, error: err.error }
        }

        return res.json()
      }
    }

    class AttachConnection {
      constructor(url, { onData }) {
        this.url = url
        this.onData = onData
      }

      open() {
        this.ws = new WebSocket(this.url)
        this.ws.binaryType = "arraybuffer"
        this.ws.onmessage = e => this.onData(
          e.data instanceof ArrayBuffer ? new Uint8Array(e.data) : e.data
        )
      }

      send(data) {
        if (this.ws?.readyState === WebSocket.OPEN) {
          this.ws.send(data)
        }
      }

      close() {
        this.ws?.close()
      }
    }

    class LoginController {
      constructor(view, onSubmit) {
        this.view = view
        this.onSubmit = onSubmit
        this.state = "username"
        this.buf = {}
      }

      start() {
        this.view.write("Username: ")
        this.view.onInput(d => this.handle(d))
      }

      async handle(data) {
        if (data === "\r") {
          if (this.state === "username") {
            this.state = "password"
            this.view.write("\r\nPassword: ")
          } else {
            try {
              await this.onSubmit(this.buf)
            } catch (e) {
              this.view.write(`\r\nLogin failed (${e.status})\r\nUsername: `)
              this.state = "username"
              this.buf = {}
            }
          }
          return
        }
        this.buf[this.state] = (this.buf[this.state] ?? "") + data
        if (this.state === "username") this.view.write(data)
      }
    }

    customElements.define("dm-ssh-terminal", DmSshTerminal)
  </script>
</body>

</html>
