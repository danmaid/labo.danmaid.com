<!doctype html>
<html lang="ja">

<head>
  <link rel="stylesheet" href="css/full-screen.css">
  <style>
    :root {
      color-scheme: dark;
    }

    table td {
      border-right: 1px solid gray;
      border-bottom: 1px solid gray;
      white-space: nowrap;
    }

    table thead,
    table tfoot {
      background-color: canvas;
    }


    .side-by-side {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .full-height {
      height: 100%;
      min-height: 0;
    }

    .scrollable {
      overflow: auto;
      min-width: 0;
      min-height: 0;
    }
  </style>
  <script src="js/dm-sdwan.js"></script>
  <script src="js/dm-catc.js"></script>
  <script src="js/dm-load-button.js"></script>
  <script>
    customElements.define('dm-sdwan-load-button', class extends DmLoadButton {
      async fetch() { return sdwan.fetch(this.url).then(r => r.json()) }
    })
    customElements.define('dm-catc-load-button', class extends DmLoadButton {
      async fetch() { return catc.fetch(this.url).then(r => r.json()) }
    })
  </script>
  <script src="js/dm-data-row.js"></script>
  <script src="js/dmanage/dm-preview-button.js"></script>
  <script type="module" src="js/dmanage/focus-preview.mjs"></script>
  <script src="vendor/vs/loader.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
  <div style="height: 100vh; display: grid; grid-template-rows: auto auto minmax(0, 1fr) 300px;">
    <div style="display: flex;">
      <fieldset>
        <legend>SD-WAN <a href="https://manager.sdwan.danmaid.com" target="_blank">↗️</a></legend>
        <dm-sdwan id="sdwan" manager="https://manager.sdwan.danmaid.com"></dm-sdwan>
      </fieldset>
      <fieldset>
        <legend>Catalyst Center <a href="https://cml29090.danmaid.com" target="_blank">↗️</a></legend>
        <dm-catc id="catc" server="https://cml29090.danmaid.com"></dm-catc>
      </fieldset>
    </div>

    <div style="display: flex;">
      <fieldset>
        <legend>通信影響視点(会議1)</legend>
        <span>TBD</span>
      </fieldset>
      <fieldset>
        <legend>設定変更視点(会議2)</legend>
        <input id="text-filter" placeholder="REQ99999">
      </fieldset>
      <fieldset>
        <legend>作業影響視点(競合)</legend>
        <input type="date"> ～ <input type="date">
        <button>TBD</button>
      </fieldset>
    </div>

    <div class="side-by-side full-height">
      <fieldset
        style="display: flex; flex-direction: column; box-sizing: border-box; flex: 1; min-width: 0; min-height: 0;">
        <legend>関連機器一覧
          <dm-sdwan-load-button url="/system/device/vedges"><span slot="title">SD-WAN</span></dm-sdwan-load-button>
          <dm-preview-button target="editor" language="json"></dm-preview-button>
          <dm-catc-load-button url="/dna/intent/api/v1/network-device"><span
              slot="title">CatC</span></dm-catc-load-button>
          <dm-preview-button for="dm-catc-load-button[url='/dna/intent/api/v1/network-device']" target="editor"
            language="json"></dm-preview-button>
        </legend>
        <div class="scrollable" style="flex: 1;">
          <table id="effective-devices">
            <thead style="position: sticky; top: 0;">
              <tr>
                <td>Source</td>
                <td>Hostname</td>
                <td>Device Status</td>
                <td>Mode</td>
                <td>Local Configuration</td>
                <td>Device Template</td>
                <td>CLI Add-On Template</td>
              </tr>
            </thead>
            <tbody>
              <dm-data-row>
                <template id="sdwan-device">
                  <tr>
                    <td>SD-WAN</td>
                    <td data-text="host-name"></td>
                    <td data-text="configStatusMessage"></td>
                    <td data-text="configOperationMode"></td>
                    <td>
                      <dm-sdwan-load-button url="/template/config/attached/{value}?type=RFS"
                        data-attr="value:uuid"><span slot="title"></span></dm-sdwan-load-button>
                      <span>
                        <script>
                          {
                            const el = document.currentScript.parentElement
                            const loader = el.parentElement.querySelector('dm-sdwan-load-button')
                            loader.addEventListener('change', () => {
                              const lines = loader.raw?.config?.split('\n')
                              el.textContent = /no config/i.test(lines?.[0])
                                ? lines[0].startsWith('no config') ? lines[0] : ''
                                : lines.length + ' lines'
                            })
                          }
                        </script>
                      </span>
                      <dm-preview-button target="editor" language="json"></dm-preview-button>
                      <dm-preview-button target="editor" language="plaintext" select="config"></dm-preview-button>
                    </td>
                    <td>
                      <dm-sdwan-load-button url="/template/device/object/{value}" data-attr="value:templateId"><span
                          slot="title"></span></dm-sdwan-load-button>
                      <span>
                        <script>
                          {
                            const el = document.currentScript.parentElement
                            const loader = el.parentElement.querySelector('dm-sdwan-load-button')
                            const row = el.closest('tr')
                            loader.addEventListener('change', () => {
                              el.textContent = loader.raw?.templateName ?? ''
                              row.data.cliTemplateId = loader.raw?.generalTemplates?.find(v => v.templateType === 'cli-template')?.templateId
                              for (const el of row.querySelectorAll('[data-attr]')) {
                                const attr = el.getAttribute('data-attr')
                                const [prop, key] = attr.split(':')
                                if (row.data[key] != null) el[prop] = row.data[key]
                              }
                            })
                          }
                        </script>
                      </span>
                      <dm-preview-button target="editor" language="json"></dm-preview-button>
                    </td>
                    <td>
                      <dm-sdwan-load-button url="/template/feature/object/{value}" data-attr="value:cliTemplateId"><span
                          slot="title"></span></dm-sdwan-load-button>
                      <span>
                        <script>
                          {
                            const el = document.currentScript.parentElement
                            const loader = el.parentElement.querySelector('dm-sdwan-load-button')
                            loader.addEventListener('change', () => {
                              el.textContent = loader.raw?.templateName ?? ''
                            })
                          }
                        </script>
                      </span>
                      <dm-preview-button target="editor" language="json"></dm-preview-button>
                      <dm-preview-button target="editor" language="plaintext"
                        select="templateDefinition.config.vipValue"></dm-preview-button>
                    </td>
                  </tr>
                </template>
                <template id="catc-device">
                  <tr>
                    <td>CatC</td>
                    <td data-text="hostname"></td>
                    <td data-text="reachabilityStatus"></td>
                    <td data-text="managementState"></td>
                    <td></td>
                    <td></td>
                    <td></td>
                  </tr>
                </template>
                <script>
                  {
                    const dataRow = document.currentScript.parentElement
                    const tbody = document.querySelector('#effective-devices tbody')

                    const vedges = document.querySelector('dm-sdwan-load-button[url="/system/device/vedges"]')
                    vedges.addEventListener('change', () =>
                      dataRow.mergeRows(tbody, vedges.raw?.data, 'sdwan-device', v => v.uuid))

                    const catc = document.querySelector('dm-catc-load-button[url="/dna/intent/api/v1/network-device"]')
                    catc.addEventListener('change', () =>
                      dataRow.mergeRows(tbody, catc.raw?.response, 'catc-device', v => v.id))
                  }
                </script>
              </dm-data-row>
            </tbody>
          </table>
        </div>
      </fieldset>
      <fieldset
        style="display: flex; flex-direction: column; box-sizing: border-box; flex: 1; min-width: 0; min-height: 0;">
        <legend>変更内容一覧
          <dm-sdwan-load-button url="/template/device"><span slot="title">SD-WAN</span></dm-sdwan-load-button>
          <dm-preview-button target="editor" language="json"></dm-preview-button>
          <dm-catc-load-button url="/dna/intent/api/v1/template-programmer/template"><span
              slot="title">CatC</span></dm-catc-load-button>
          <dm-preview-button for="dm-catc-load-button[url='/dna/intent/api/v1/template-programmer/template']"
            target="editor" language="json"></dm-preview-button>
        </legend>
        <div class="scrollable" style="flex: 1;">
          <table id="effective-templates">
            <thead style="position: sticky; top: 0;">
              <tr>
                <td>Source</td>
                <td>Name</td>
                <td>in use</td>
                <td>Device Type</td>
                <td>children</td>
                <td>Description</td>
              </tr>
            </thead>
            <tbody>
              <dm-data-row>
                <template id="sdwan-template">
                  <tr>
                    <td>SD-WAN</td>
                    <td data-text="templateName"></td>
                    <td data-text="devicesAttached"></td>
                    <td data-text="deviceType"></td>
                    <td data-text="templateAttached"></td>
                    <td data-text="templateDescription"></td>
                  </tr>
                </template>
                <template id="catc-template">
                  <tr>
                    <td>CatC</td>
                    <td data-text="name"></td>
                    <td>-</td>
                    <td>TBD</td>
                    <td>-</td>
                    <td></td>
                  </tr>
                </template>
                <script>
                  {
                    const dataRow = document.currentScript.parentElement
                    const tbody = document.querySelector('#effective-templates tbody')

                    const vedges = document.querySelector('dm-sdwan-load-button[url="/template/device"]')
                    vedges.addEventListener('change', () =>
                      dataRow.mergeRows(tbody, vedges.raw?.data, 'sdwan-template', v => v.templateId))

                    const catc = document.querySelector('dm-catc-load-button[url="/dna/intent/api/v1/template-programmer/template"]')
                    catc.addEventListener('change', () =>
                      dataRow.mergeRows(tbody, catc.raw, 'catc-template', v => v.templateId))
                  }
                </script>
              </dm-data-row>
            </tbody>
          </table>
        </div>
      </fieldset>
    </div>

    <div>
      <fieldset style="height: 100%; box-sizing: border-box;">
        <legend>プレビュー</legend>
        <div id="editor" style="height: 100%; "></div>
      </fieldset>
      <script>
        require.config({ paths: { vs: "vendor/vs" } })
        require(["vs/editor/editor.main"], function () {
          editor = monaco.editor.create(document.getElementById("editor"), {
            theme: "vs-dark",
            automaticLayout: true,
            tabSize: 2,
            insertSpaces: true,
          })
        })
      </script>
    </div>
  </div>
</body>

</html>
