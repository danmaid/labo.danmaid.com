<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <style>
    :root {
      color-scheme: dark;
    }
  </style>
  <!-- <script type="module" src="js/sha.mjs"></script> -->
</head>

<body>
  <script type="module">
    import { SHA256DigestStream } from './sha.mjs'

    async function check(text) {
      const expected = Array.from(
        new Uint8Array(
          await crypto.subtle.digest(
            "SHA-256",
            new TextEncoder().encode(text)
          )
        )
      ).map(x => x.toString(16).padStart(2, "0")).join("")

      // あなたの実装
      const source = new ReadableStream({
        start(c) {
          c.enqueue(new TextEncoder().encode(text))
          c.close()
        }
      })

      const { value } = await source
        .pipeThrough(new SHA256DigestStream())
        .getReader()
        .read()

      const actual = [...value]
        .map(x => x.toString(16).padStart(2, "0"))
        .join("")

      console.log('CHECK', expected === actual, { text, expected, actual })
    }
    check('abc')
  </script>
</body>

</html>
