name: devcontainer-nginx
services:
  app:
    image: mcr.microsoft.com/devcontainers/base:debian
    volumes:
      - ..:/workspace
    command: sleep infinity

  nginx:
    image: nginx:alpine
    ports:
      - "6080:80"
      - "6443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../mig:/var/www/html:ro
    command: sh -c "apk add --no-cache openssl && [ -f /etc/nginx/server.crt ] || openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/nginx/server.key -out /etc/nginx/server.crt -subj '/CN=localhost' && nginx -g 'daemon off;'"
