<!doctype html>
<html lang="ja">

<head>
  <style>
    :root {
      color-scheme: dark;
    }
  </style>
  <script src="js/dm-sdwan.js"></script>
  <script src="js/dm-terminal.mjs" type="module"></script>
</head>

<body>
  <div>
    <dm-sdwan manager="https://manager.sdwan.danmaid.com"></dm-sdwan>
    <input id="system-ip" value="100.1.1.1"><button>ssh
      <script>
        document.currentScript.parentElement.addEventListener('click', async () => {
          const sdwan = document.querySelector('dm-sdwan')
          const systemIp = document.getElementById('system-ip').value
          const ssh = await sdwan.ssh(systemIp)
          console.log(ssh)
          const socket = new SdwanSshSocket(new URL(ssh.data.connectURL, sdwan.manager))
          const term = document.querySelector('dm-terminal')
          socket.addEventListener('message', e => term.write(e.data))
          term.onData(data => socket.send(data))
        })
      </script>
    </button>
  </div>
  <dm-terminal></dm-terminal>
</body>

</html>
