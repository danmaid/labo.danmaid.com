  <script type="module">
    import { Terminal } from './vendor/xterm/xterm.mjs'

        const core = this.xterm._core
        console.log({ core })
        const dims = core._renderService.dimensions
        console.log({ dims })

        const cw = dims.actualCellWidth
        const ch = dims.actualCellHeight
        console.log({ cw, ch })
        // // Element のサイズを調整
        // const el = document.getElementById('terminal')
        // el.style.width = dims.width + 'px'
        // el.style.height = dims.height + 'px'

        // その後、fit() で反映
        fit.fit()

        new ResizeObserver(() => fit.fit()).observe(this)
      }
      connectedCallback() {
        const core = this.xterm._core
        console.log('cc', { core })
        const dims = core._renderService.dimensions
        console.log('cc', { dims })

        const cw = dims.actualCellWidth
        const ch = dims.actualCellHeight
        console.log('cc', { cw, ch })
      }
    }
    customElements.define('dm-terminal', DmTerminal)
    document.createElement('dm-terminal')
  </script>
  <script type="module">
    import { Terminal } from 'xterm';
    import { FitAddon } from 'xterm-addon-fit';

    const term = new Terminal({
      convertEol: true,
      fontFamily: 'monospace',
      fontSize: 14,
    });
    const fitAddon = new FitAddon();
    term.loadAddon(fitAddon);

    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    // ------------------------------
    // ① 初回接続 → セッション作成
    // ------------------------------
    async function createSession() {
      const payload = new URLSearchParams();
      payload.set('width', 98);
      payload.set('height', 30);
      payload.set('rooturl', location.href);

      const res = await fetch('/shell/?', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: payload.toString()
      });

      const json = await res.json();
      return json.session;
    }

    let sessionId = null;

    // ------------------------------
    // ② poll（出力取得）
    // ------------------------------
    async function pollOutput() {
      while (true) {
        try {
          const payload = new URLSearchParams();
          payload.set('session', sessionId);
          payload.set('poll', '1');

          const res = await fetch(`/shell/${sessionId}/?`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: payload.toString()
          });

          const json = await res.json();

          if (json.data || json.output) {
            term.write(json.data || json.output);
          }

        } catch (e) {
          // exit 時などに暴走しないように少し待つ
          await new Promise(r => setTimeout(r, 100));
        }
      }
    }

    // ------------------------------
    // ③ キー入力（keys=）
    // ------------------------------
    term.onData(async data => {
      const payload = new URLSearchParams();
      payload.set('session', sessionId);
      payload.set('keys', encodeKeysToHex(data));

      await fetch(`/shell/${sessionId}/?`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: payload.toString()
      });
    });

    // ------------------------------
    // セッション開始
    // ------------------------------
    (async () => {
      sessionId = await createSession();
      pollOutput();
    })();

    function encodeKeysToHex(data) {
      let hex = '';
      for (let i = 0; i < data.length; i++) {
        hex += data.charCodeAt(i).toString(16).toUpperCase().padStart(2, '0');
      }
      return hex;
    }
  </script>
</body>

</html>
