<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>Remote Serial API Test</title>
  <link rel="stylesheet" href="./css/full-screen.css" />
  <script type="module" src="./js/dm-terminal.mjs"></script>
  <link rel="manifest" href="./manifest.webmanifest" />
</head>

<body class="full-screen" style="display: flex; flex-direction: column;">
  <button onclick="connect()">Connect</button>
  <dm-terminal id="terminal"></dm-terminal>

  <script>
    async function connect() {
      const ws = new WebSocket('wss://cml3.danmaid.com:6901/serial/ttyACM0')
      ws.binaryType = 'arraybuffer'
      const term = document.getElementById("terminal")

      ws.addEventListener('open', () => console.log('WebSocket connection opened'))
      ws.addEventListener('message', (e) => console.log('Received message:', e.data))
      ws.addEventListener('close', () => console.log('WebSocket connection closed'))
      ws.addEventListener('error', (e) => console.error('WebSocket error:', e))

      const encoder = new TextEncoder()
      ws.addEventListener('message', (e) => term.write(e.data instanceof ArrayBuffer ? new Uint8Array(e.data) : e.data))
      term.onData(data => ws.send(encoder.encode(data)))
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js')
    }
  </script>
</body>

</html>
