<!doctype html>
<html>

<head>
  <base target="main">
  <link rel="stylesheet" href="css/full-screen.css">
  <link rel="stylesheet" href="css/grid.css">
  <link rel="stylesheet" href="css/left-center-right.css">
  <link rel="stylesheet" href="css/auto-title-tooltip.css">
  <style>
    :root {
      color-scheme: dark;
    }

    .grid {
      --sidebar-width: 48px;
      --header-height: 32px;
      --footer-height: 32px;
    }
  </style>
  <script src="js/dm-windows.js"></script>
  <script type="module" src="tools/sshd/dm-ssh-terminal.mjs"></script>
  <script>
    /**
     * @typedef {Object} Item
     * @property {string} title
     * @property {string} url
     * @property {'action' | 'ref'} role
     * @property {'tool' | 'page'} [scope]
     */
    // 初期値及びテストデータ
    const data = [
      { title: 'SSH', url: 'http://localhost:8080', role: 'action', scope: 'tool' },
      { title: 'アドレス台帳', url: 'index.html', role: 'ref' },
    ]

    /** @type {(item: Item) => HTMLElement} */
    function render(item) {
      const a = document.createElement('a')
      a.href = item.url
      a.textContent = item.title
      return a
    }
  </script>
</head>

<body class="full-screen grid">
  <header class="left-center-right">
    <div>left</div>
    <div>center</div>
    <div>
      <a href="terminals.html">Terminals</a>
      <a href="ssh.html">SSH</a>
      right
    </div>
  </header>
  <aside>
    <span title="Human to Computer actions">left</span>
    <a href="cml.html">CML</a>
    <h3>Tools</h3>
    <nav data-render data-role="action" data-scope="tool">
      <script>
        for (const tool of data.filter(v => v.role === 'action' && v.scope === 'tool')) {
          document.currentScript.parentElement.appendChild(render(tool))
        }
      </script>
    </nav>
  </aside>
  <main>
    <iframe name="main" src="http://localhost:8080"
      style="width: 100%; height: 100%; border: none; display: block;"></iframe>
    <script>
      /** @type {HTMLIFrameElement} */
      const iframe = document.currentScript.previousElementSibling
      iframe.addEventListener('load', () => {
        console.log('Iframe loaded', iframe.contentWindow)
        iframe.contentWindow.addEventListener('click', (ev) => {
          console.log('Clicked inside iframe', ev)
          if (ev.target.href?.startsWith('ssh:')) {
            ev.preventDefault()
            const url = new URL(ev.target.href)
            const win = openSSHWindow({ host: url.hostname, role: 'writer' })
            const rect = ev.target.getBoundingClientRect()
            const frameRect = iframe.getBoundingClientRect()
            win.style.left = frameRect.left + rect.right + 'px'
            win.style.top = frameRect.top + rect.top + 'px'
            win.style.width = '80ch'
            win.style.height = '24em'
          }
        })
      })
    </script>
  </main>
  <aside>
    <span title="Computer to Human actions">right</span>
    <button>T1
      <script>
        document.currentScript.parentElement.addEventListener('click', () => {
          console.log('Creating new SSH window for T1')
          openSSHWindow({ host: 'nanopi-r1.local' })
        })
      </script>
    </button>
    <a href="ssh-terminal.html?session=083c3d9f5ff660c8&role=writer"
      onclick="window.open(this.href,'_blank', 'popup,width=800,height=600'); return false;">T2</a>
    <a href="ssh-terminal.html?host=nanopi-r1.local"
      onclick="window.open(this.href,'_blank', 'popup,width=800,height=600'); return false;">T3</a>
    <button>T4
      <script>
        document.currentScript.parentElement.addEventListener('click', () => {
          console.log('Creating new window for T4')
          createWindow({ title: 'Terminal T4', content: document.createTextNode('This is a new window created by the main page.') })
        })
      </script>
    </button>
  </aside>
  <footer class="left-center-right">
    <div style="display: flex;">left
      <div style="display: flex;">
        <div>テスト</div>
        <div>テスト</div>
      </div>
    </div>
    <nav class="center" data-render data-role="ref">
      <script>
        for (const ref of data.filter(item => item.role === 'ref')) {
          document.currentScript.parentElement.appendChild(render(ref))
        }
      </script>
    </nav>
    <div>
      <a href="settings.html" style="
  display: inline-block;
  padding: 0 8px;
  background: #0078d4;
  color: white;
  text-decoration: none;
  border-radius: 4px;
">設定</a>
      <span>&copy; 2026 danmaid</span>
    </div>
  </footer>

  <script>
    // 本番データを読み込んで上書き
    fetch('test.json').then(r => r.json()).then(remote => {
      data.splice(0, data.length, ...remote)
      for (const el of document.querySelectorAll('[data-render]')) {
        el.replaceChildren() // 既存の内容をクリア
        const role = el.getAttribute('data-role')
        const scope = el.getAttribute('data-scope')
        for (const item of data.filter(v => v.role === role && (!scope || v.scope === scope))) {
          el.appendChild(render(item))
        }
      }
    })
  </script>
  <dm-windows></dm-windows>
  <template>
    <dm-window>
      <dm-ssh-terminal></dm-ssh-terminal>
    </dm-window>
  </template>
  <script>
    const template = document.currentScript.previousElementSibling
    function createWindow({ title = "Window", content } = {}) {
      const fragment = template.content.firstElementChild.cloneNode(true)
      const windows = document.querySelector('dm-windows')
      windows.appendChild(fragment)
      return fragment
    }
    function openSSHWindow({ socket, session, role, host, broker = 'http://localhost:8080' } = {}) {
      const window = document.createElement('dm-window')
      const ssh = document.createElement('dm-ssh-terminal')
      if (broker) ssh.setAttribute('broker', broker)
      if (host) ssh.setAttribute('host', host)
      if (role) ssh.setAttribute('role', role)
      if (session) ssh.setAttribute('session', session)
      if (socket) ssh.setAttribute('socket', socket)
      window.setAttribute('title', `SSH: ${host || session || 'unknown'}`)
      window.appendChild(ssh)
      const windows = document.querySelector('dm-windows')
      windows.appendChild(window)
      return window
    }
  </script>
</body>

</html>
