<!doctype html>
<html lang="ja">

<head>
  <link rel="stylesheet" href="css/full-screen.css">
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    body>:nth-child(1) {
      grid-column: 1 / span 2;
    }
  </style>
  <script src="js/dm-terminal.mjs" type="module"></script>
  <script src="vendor/vs/loader.js"></script>
  <script>require.config({ paths: { vs: "vendor/vs" } })</script>
  <script src="js/dm-monaco-editor.js"></script>
</head>

<body class="full-screen">
  <fieldset>
    <legend>Logger</legend>
    <div>
      <table>
        <thead>
          <tr>
            <th>buffer</th>
            <th>file</th>
            <th>stored</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>30</td>
            <td>xxx.log</td>
            <td>356</td>
          </tr>
          <tr>
            <td>45</td>
            <td>yyy.log</td>
            <td>512</td>
          </tr>
        </tbody>
      </table>
      <tfoot>
        <button>directory</button>
        <span>hostname-20260718-123456.log</span>
      </tfoot>
    </div>
    <hr>
    <dm-logger></dm-logger>
    <script>
      class DmDirectory extends HTMLElement {
        /** @type {FileSystemDirectoryHandle | null} */
        handle = null
        constructor() {
          super()
          const shadow = this.attachShadow({ mode: 'open' })
          const button = document.createElement('button')
          button.textContent = 'Select'
          button.addEventListener('click', async () => {
            try {
              button.disabled = true
              const dirHandle = await globalThis.showDirectoryPicker()
              console.log(1, dirHandle)
              this.handle = dirHandle
              this.dispatchEvent(new Event('change'))
            } finally {
              button.disabled = false
            }
          })
          shadow.appendChild(button)
        }
      }
      customElements.define('dm-directory', DmDirectory)

      class FileLogger {
        constructor(file) {
          console.log(file)
          /** @type {FileSystemFileHandle} */
          this.file = file
          /** @type {string[]} */
          this.chunks = []
        }

        write(text) {
          this.chunks.push(text)
          console.debug(text)
        }
      }

      customElements.define('dm-logger', class DmLogger extends HTMLElement {
        static dateTimeFormat = new Intl.DateTimeFormat("ja-JP", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        })
        static getDate(date = new Date()) {
          const parts = this.dateTimeFormat.formatToParts(date)
          const d = parts.filter(v => v.type !== 'literal').map(v => v.value)
          return d.slice(0, 3).join('') + '-' + d.slice(3).join('')
        }

        async createLogger(key = 'dm-logger') {
          if (!this.dir.handle) await new Promise(r => this.dir.addEventListener('change', r, { once: true }))
          const dir = this.dir.handle
          console.log(2, dir, await dir.queryPermission({ mode: "readwrite" }))
          if (!dir) throw new Error('Directory handle is not set')
          const filename = `${key}-${DmLogger.getDate()}.log`
          await dir.getFileHandle(filename, { create: false })
            .then(() => { throw new Error('File already exists') })
            .catch((e) => { console.log(e) })
          try {
            console.log(3, dir, await dir.requestPermission({ mode: "readwrite" }))
            const file = await dir.getFileHandle(filename, { create: true })
          } catch (e) {
            console.error(e)
          }
          return
          return new FileLogger(file)
        }

        /** @type {DmDirectory} */
        dir = document.createElement('dm-directory')
        constructor() {
          super()
          const shadow = this.attachShadow({ mode: 'open' })
          shadow.appendChild(this.dir)
          // this.load()
          this.createLogger().then(x => {
            console.log(x)
          }).catch(e => {
            console.error(e)
          })
        }

        async load() {
          const text = this.button.textContent
          try {
            this.button.textContent = '...'
            const dirHandle = await this.config.load()
            console.log(dirHandle)
            if (!(dirHandle instanceof FileSystemDirectoryHandle)) throw new Error('Invalid directory handle')
            this.dirHandle = dirHandle
            this.button.textContent = dirHandle.name
          } catch {
            this.button.textContent = text
          }
        }

        config = {
          async load() {
            await new Promise(r => setTimeout(r, 1000))
          },
          async save() { }
        }
      })
    </script>
    <button>dir
      <script>
        class DmLogger extends EventTarget {
          /** @type { ArrayBuffer[] } */
          chunks = []

          /** @type { (text: ArrayBuffer) => void } */
          write(chunk) {
            this.chunks.push(chunk)
            this.dispatchEvent(new MessageEvent('message', { data: chunk }))
          }
        }

        class DmStringLogger extends DmLogger {
          static encoder = new TextEncoder()
          /** @type { (text: string) => void } */
          write(text) {
            const encoded = DmStringLogger.encoder.encode(text)
            const hex = [...encoded].map(b => b.toString(16).padStart(2, '0')).join(' ')
            console.debug(`${hex} | ${JSON.stringify(text)}`)
            super.write(encoded.buffer)
          }
        }

        {
          const logger = new DmStringLogger()
          addEventListener('load', () => {
            const term = document.querySelector('dm-terminal')
            customElements.whenDefined('dm-terminal').then(() => {
              term.onData(d => d === '\r' ? term.write('\r\n') : term.write(d))

              term.onData(data => logger.write(data))
            })

            const preview = document.querySelector('dm-monaco-editor')
            customElements.whenDefined('dm-monaco-editor').then(() => {
              const decoder = new TextDecoder()
              logger.addEventListener('message', e => {
                const text = decoder.decode(e.data)
                preview.editor.setValue(preview.editor.getValue() + text)
              })
            })
          })

          const button = document.currentScript.parentElement
          Promise.resolve().then(async () => {
            const db = await new Promise((resolve, reject) => {
              const req = indexedDB.open('dm-logger', 1)
              req.onupgradeneeded = () => {
                const db = req.result
                db.createObjectStore('config')
              }
              req.onsuccess = () => resolve(req.result)
              req.onerror = () => reject(req.error)
            })
            const dir = await new Promise((resolve, reject) => {
              const tx = db.transaction('config', 'readonly')
              const store = tx.objectStore('config')
              const req = store.get('default')
              req.onsuccess = () => resolve(req.result)
              req.onerror = () => reject(req.error)
            })
            await db.close()

            if (dir) {
              const dirHandle = dir
              console.log(dirHandle.name)
              const permission = await dirHandle.queryPermission({ mode: "readwrite" })
              console.log(permission)
              if (permission !== "granted") {
                window.addEventListener('pointerdown', async () => {
                  const result =
                    await dirHandle.requestPermission({
                      mode: "readwrite",
                    });

                  if (result !== "granted") {
                    throw new Error("permission denied");
                  }
                  console.log(await dirHandle.queryPermission({ mode: "readwrite" }))
                }, { once: true })
              }
              if (permission === "granted") {
                button.textContent = dirHandle.name
                const files = []
                for await (const entry of dirHandle.values()) {
                  if (entry.kind === 'file') {
                    files.push(entry.name)
                  }
                }
                console.log(files)
              }
            }
          })

          button.addEventListener('click', async () => {
            const dirHandle = await window.showDirectoryPicker()
            console.log(dirHandle.name)
            console.log(await dirHandle.queryPermission({ mode: "readwrite" }))
            await new Promise((resolve, reject) => {
              const req = indexedDB.open('dm-logger', 1)
              req.onsuccess = () => {
                const db = req.result
                const tx = db.transaction('config', 'readwrite')
                const store = tx.objectStore('config')
                const putReq = store.put(dirHandle, 'default')
                putReq.onsuccess = () => {
                  resolve()
                  db.close()
                }
                putReq.onerror = () => reject(putReq.error)
              }
              req.onerror = () => reject(req.error)
            })
            button.textContent = dirHandle.name
          })
        }
      </script>
    </button>
  </fieldset>
  <fieldset>
    <legend>Terminal</legend>
    <dm-terminal logger></dm-terminal>
  </fieldset>
  <fieldset>
    <legend>Preview</legend>
    <dm-monaco-editor></dm-monaco-editor>
  </fieldset>
</body>

</html>
