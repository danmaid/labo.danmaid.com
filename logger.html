<!doctype html>
<html lang="ja">

<head>
  <link rel="stylesheet" href="css/full-screen.css">
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr;
    }

    body>:nth-child(1) {
      grid-column: 1 / span 2;
    }

    table td,
    table th {
      border-right: 1px solid #666;
      border-bottom: 1px solid #666;
    }

    table caption {
      border-bottom: 1px solid #666;
    }

    table {
      font-family: monospace;
    }
  </style>
  <script src="js/dm-terminal.mjs" type="module"></script>
  <script src="vendor/vs/loader.js"></script>
  <script>require.config({ paths: { vs: "vendor/vs" } })</script>
  <script src="js/dm-monaco-editor.js"></script>
</head>

<body class="full-screen">
  <fieldset>
    <legend>Logger</legend>
    <dm-logger></dm-logger>
    <script>
      class Logger extends EventTarget {
        id = crypto.randomUUID()
        type = 'arraybuffer'
        /** @type { ArrayBuffer[] } */
        chunks = []

        /** @type { (chunk: ArrayBuffer) => void } */
        write(chunk) {
          this.chunks.push(chunk)
          queueMicrotask(() => this.dispatchEvent(new Event('change')))
        }
      }

      class TextLogger extends Logger {
        static encoder = new TextEncoder()
        type = 'text'

        /** @type { (text: string) => void } */
        write(text) {
          super.write(TextLogger.encoder.encode(text).buffer)
        }
      }

      class Adapter {
        id = crypto.randomUUID()
        logger = null
        target = null
        attach(el) {
          this.target = el
          el.adapter = this
          el.logger = this.logger
        }
      }

      class DmTerminalAdapter extends Adapter {
        type = 'dm-terminal'
        logger = new TextLogger()

        async attach(el) {
          super.attach(el)
          await customElements.whenDefined('dm-terminal')
          el.onData(data => this.logger.write(data))
        }
      }

      customElements.define('dm-logger', class DmLogger extends HTMLElement {
        /** @type { Logger[] } */
        loggers = []
        loggerMap = new Map([
          ['text', TextLogger],
          ['arraybuffer', Logger]
        ])
        adapters = []
        adapterMap = new Map([
          ['dm-terminal', DmTerminalAdapter]
        ])

        /** @type { () => Logger } */
        createLogger(type = null) {
          const LoggerClass = this.loggerMap.get(type) ?? Logger
          const logger = new LoggerClass()
          this.loggers.push(logger)
          queueMicrotask(() => this.dispatchEvent(new Event('change')))
          return logger
        }

        /** @type { () => DmTerminalAdapter } */
        createAdapter(type) {
          const AdapterClass = this.adapterMap.get(type)
          if (!AdapterClass) throw new Error(`Unknown adapter type: ${type}`)
          const adapter = new AdapterClass()
          this.adapters.push(adapter)
          this.loggers.push(adapter.logger)
          queueMicrotask(() => this.dispatchEvent(new Event('change')))
          return adapter
        }

        connectedCallback() {
          for (const adapter of this.adapters) {
            for (const el of document.querySelectorAll(adapter.type)) {
              if (el.adapter) continue
              adapter.attach(el)
            }
          }
          new MutationObserver(mutations => {
            for (const mutation of mutations) {
              for (const node of mutation.addedNodes) {
                if (!(node instanceof HTMLElement)) continue
                for (const [tag] of this.adapterMap) {
                  for (const el of node.querySelectorAll(tag)) {
                    if (el.adapter) continue
                    this.createAdapter(tag).attach(el)
                  }
                }
              }
            }
          }).observe(document, { childList: true, subtree: true })
        }
      })
    </script>
    <table>
      <caption>Adapters</caption>
      <thead>
        <tr>
          <th>id</th>
          <th>type</th>
          <th>target</th>
          <th>logger</th>
        </tr>
      </thead>
      <tbody>
        <template>
          <tr data-bind>
            <td data-bind="id"></td>
            <td data-bind="type"></td>
            <td data-bind="target.id"></td>
            <td data-bind="logger.id"></td>
            <script>
              {
                const tr = document.currentScript.parentElement
                const adapter = tr.data
                for (const el of tr.querySelectorAll('[data-bind]')) {
                  const key = el.getAttribute('data-bind')
                  const value = key.split('.').reduce((v, k) => v?.[k], adapter)
                  el.textContent = value
                }
              }
            </script>
          </tr>
        </template>
        <script>
          {
            const tbody = document.currentScript.parentElement
            const template = tbody.querySelector('template')
            const dmLogger = document.querySelector('dm-logger')
            dmLogger.addEventListener('change', () => {
              tbody.replaceChildren()
              for (const adapter of dmLogger.adapters) {
                const fragment = template.content.cloneNode(true)
                for (const el of fragment.querySelectorAll('[data-bind]')) {
                  el.data = adapter
                }
                tbody.appendChild(fragment)
              }
            })
          }
        </script>
      </tbody>
    </table>
    <table>
      <caption>Loggers</caption>
      <thead>
        <tr>
          <th>id</th>
          <th>type</th>
          <th>chunks</th>
          <th>bytes</th>
          <td></td>
        </tr>
      </thead>
      <tbody>
        <template>
          <tr data-bind>
            <td data-bind="id"></td>
            <td data-bind="type"></td>
            <td id="chunks">30</td>
            <td id="bytes">356</td>
            <td>
              <button>preview
                <script>
                  {
                    const button = document.currentScript.parentElement
                    const decoder = new TextDecoder()
                    button.addEventListener('click', () => {
                      const tr = button.closest('tr')
                      const logger = tr.data
                      const editor = document.querySelector('dm-monaco-editor')
                      editor.editor.setValue(logger.chunks.reduce((acc, chunk) => {
                        return acc + decoder.decode(chunk)
                      }, ''))
                    })
                    /**
const lastLine = model.getLineCount();
const lastColumn = model.getLineMaxColumn(lastLine);

model.applyEdits([
  {
    range: new monaco.Range(
      lastLine,
      lastColumn,
      lastLine,
      lastColumn
    ),
    text: chunk,
  }
]);
                     */
                  }
                </script>
              </button>
              <button>download
                <script>
                  {
                    const button = document.currentScript.parentElement
                    button.addEventListener('click', () => {
                      const tr = button.closest('tr')
                      const logger = tr.data
                      const blob = new Blob(logger.chunks)
                      const url = URL.createObjectURL(blob)
                      const a = document.createElement('a')
                      a.href = url
                      a.download = `${logger.type ?? 'log'}.log`
                      a.click()
                      URL.revokeObjectURL(url)
                    })
                  }
                </script>
              </button>
            </td>
            <script>
              {
                const tr = document.currentScript.parentElement
                const indexTd = tr.querySelector('#index')
                const chunksTd = tr.querySelector('#chunks')
                const bytesTd = tr.querySelector('#bytes')
                const logger = tr.data
                for (const el of tr.querySelectorAll('[data-bind]')) {
                  const key = el.getAttribute('data-bind')
                  if (key in logger) el.textContent = logger[key]
                }
                const update = () => {
                  chunksTd.textContent = logger.chunks.length
                  bytesTd.textContent = logger.chunks.reduce((sum, chunk) => sum + chunk.byteLength, 0)
                }
                logger.addEventListener('change', update)
                update()
              }
            </script>
          </tr>
        </template>
        <script>
          {
            const tbody = document.currentScript.parentElement
            const template = tbody.querySelector('template')
            const dmLogger = document.querySelector('dm-logger')
            dmLogger.addEventListener('change', () => {
              tbody.replaceChildren()
              for (const logger of dmLogger.loggers) {
                const fragment = template.content.cloneNode(true)
                for (const el of fragment.querySelectorAll('[data-bind]')) {
                  el.data = logger
                }
                tbody.appendChild(fragment)
              }
            })
          }
        </script>
      </tbody>
    </table>
    <select id="logger-type">
      <option value="">ArrayBuffer</option>
      <option value="text">Text</option>
    </select>
    <button>create
      <script>
        document.currentScript.parentElement.addEventListener('click', () => {
          const logger = document.querySelector('dm-logger')
          const type = document.querySelector('#logger-type').value
          const newLogger = logger.createLogger(type || null)
          console.log(newLogger)
        })
      </script>
    </button>
  </fieldset>
  <fieldset>
    <template>
      <fieldset>
        <legend>terminal</legend>
        <dm-terminal></dm-terminal>
        <script>
          {
            const dmTerminal = document.currentScript.parentElement.querySelector('dm-terminal')
            customElements.whenDefined('dm-terminal').then(() => {
              dmTerminal.onData(d => dmTerminal.write(d === '\r' ? '\r\n' : d))
            })
          }
        </script>
      </fieldset>
    </template>
    <legend>Terminal <button>create
        <script>
          {
            const container = document.currentScript.closest('fieldset')
            const template = container.querySelector('template')
            const button = document.currentScript.parentElement
            button.addEventListener('click', () => {
              const fragment = template.content.cloneNode(true)
              const dmTerminal = fragment.querySelector('dm-terminal')
              dmTerminal.id ||= crypto.randomUUID()
              container.appendChild(fragment)
            })
            button.click()
          }
        </script>
      </button></legend>
  </fieldset>
  <fieldset>
    <legend>Preview</legend>
    <dm-monaco-editor></dm-monaco-editor>
  </fieldset>
</body>

</html>
