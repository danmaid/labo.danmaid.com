topology:
  console1:
    links:
      - source: uart1
        destination: tcp1
      - source: uart1
        destination: websocket
      - source: tcp1
        destination: uart1

  console2:
    links:
      - source: uart2
        destination: websocket
      - source: websocket
        destination: uart2
    xxx:
      yyy: value
      zzz: another_value
    aaa: value

  console3:
    links:
      - source: websocket
        destination: console1
      - source: console1
        destination: websocket

endpoint:
  uart1:
    type: serial
    device: /dev/ttyUSB0
    baudrate: 115200

  tcp1:
    type: tcp-listener
    listen: ":2001"

  uart2:
    type: serial
    device: /dev/ttyUSB1
    baudrate: 9600

  websocket:
    type: websocket-listener

  console1:
    type: topology
