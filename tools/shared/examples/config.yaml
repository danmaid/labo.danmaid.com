endpoints:
  websocket:
    type: factory
    template:
      type: websocket

  ssh:
    type: factory
    params:
      args: ""
    template:
      type: exec
      line: /bin/ssh ${args}

  messages:
    type: exec
    line: tail -f /var/log/messages

  uart1:
    type: serial
    device: /dev/ttyUSB0
    baudrate: 115200

topologies:
  ssh:
    links:
      - source: ssh
        destination: websocket
      - source: websocket
        destination: ssh
    params:
      ssh-id: ""
      websocket-id: ""

  messages:
    links:
      - source: messages
        destination: websocket
    params:
      websocket-id: ""
