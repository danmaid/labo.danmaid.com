listen: ":8080"
basePath: "/api/v1"
topologies:
  ssh:
    links:
      - source: ssh
        destination: websocket
      - source: websocket
        destination: ssh
    params:
      ssh: "{id}"
      websocket: "{id}"

  messages:
    links:
      - source: messages
        destination: websocket
    params:
      websocket: "{id}"

endpoints:
  websocket:
    type: factory
    template:
      type: websocket

  serial:
    type: factory
    template:
      type: exec
      line: /bin/picocom ${args}
    params:
      args: ""

  ssh:
    type: factory
    template:
      type: exec
      line: /bin/ssh ${args}
    params:
      args: ""

  messages:
    type: exec
    line: /bin/tail -f /var/log/messages

  serial1:
    type: file
    path: /dev/ttyUSB0
