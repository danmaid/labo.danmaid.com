<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSH Broker</title>
  <script type="module" src="./dm-ssh-terminal.mjs"></script>
  <style>
    :root {
      --bg: #f4efe6;
      --panel: rgba(255, 251, 245, 0.92);
      --line: #d6c9b2;
      --ink: #1f2a2f;
      --muted: #6a6e67;
      --accent: #006a6a;
      --accent2: #d6673a;
      --ok: #2d7a47;
      --bad: #a33636;
      --sidebar: 320px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      height: 100dvh;
      overflow: hidden;
      font-family: "IBM Plex Sans JP", "Hiragino Sans", sans-serif;
      font-size: 14px;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(214,103,58,.18), transparent 28%),
        radial-gradient(circle at top right, rgba(0,106,106,.16), transparent 30%),
        linear-gradient(180deg, #fbf7f0, var(--bg));
    }

    .sidebar {
      width: var(--sidebar);
      min-width: var(--sidebar);
      height: 100%;
      overflow-y: auto;
      padding: 14px;
      border-right: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .sidebar-title {
      font-family: "Azeret Mono", "Consolas", monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .03em;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px;
    }
    .section {
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .section:last-child { border-bottom: 0; margin-bottom: 0; }
    .section-title {
      font-family: "Azeret Mono", "Consolas", monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    label {
      display: block;
      font-size: 11px;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input,
    select {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,.82);
      color: var(--ink);
      font: inherit;
    }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .buttons { display: flex; flex-direction: column; gap: 8px; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: transform 100ms ease, opacity 100ms ease;
      background: linear-gradient(135deg, var(--accent), #004f52);
      text-align: left;
    }
    button.secondary { background: linear-gradient(135deg, var(--accent2), #aa4822); }
    button.ghost { background: linear-gradient(135deg, #8f8d84, #6f6b63); }
    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: .45; cursor: default; transform: none; }
    .meta {
      font: 11px/1.5 "Azeret Mono", "Consolas", monospace;
      color: var(--muted);
      word-break: break-all;
      max-height: 160px;
      overflow-y: auto;
    }
    .hint {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
      margin-top: 6px;
    }

    .workspace {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow: hidden;
    }

    .term-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 12px 12px 0;
    }
    .term-wrap.mirror {
      flex: 0 0 220px;
      padding-bottom: 12px;
    }

    .term-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .term-head strong {
      font-family: "Azeret Mono", "Consolas", monospace;
      font-size: 12px;
    }
    .status {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(31,42,47,.08);
      color: var(--muted);
    }
    .status.ok { background: rgba(45,122,71,.14); color: var(--ok); }
    .status.bad { background: rgba(163,54,54,.14); color: var(--bad); }

    .xterm-container {
      flex: 1;
      min-height: 0;
      border-radius: 14px;
      overflow: hidden;
      background: #171917;
      padding: 6px;
      color: #b7c7b3;
      font: 12px/1.4 "Azeret Mono", "Consolas", monospace;
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 0 12px;
      flex-shrink: 0;
    }
  </style>

  <script>
    var state = {
      sessionId: "",
      sessions: [],
      writerSize: null,
      readonlySize: null,
    };

    function log(msg, obj) {
      var metaLog = document.getElementById("metaLog");
      if (!metaLog) return;
      var out = obj === undefined ? msg : `${msg}\n${JSON.stringify(obj, null, 2)}`;
      metaLog.textContent = `${new Date().toLocaleTimeString()} ${out}\n\n${metaLog.textContent}`.trim();
    }

    function setStatus(target, text, kind) {
      if (!target) return;
      target.textContent = text;
      target.className = `status ${kind || ""}`.trim();
    }

    function setSessionId(id) {
      state.sessionId = id || "";
      document.dispatchEvent(new CustomEvent("sessionchange"));
    }

    function syncState(el) {
      function update() { el.disabled = !state.sessionId; }
      document.addEventListener("sessionchange", update);
      update();
    }

    function authHeaders() {
      var authToken = document.getElementById("authToken");
      return {
        "Authorization": `Bearer ${authToken.value.trim()}`,
        "Content-Type": "application/json",
      };
    }

    function authOnlyHeaders() {
      var authToken = document.getElementById("authToken");
      return {
        "Authorization": `Bearer ${authToken.value.trim()}`,
      };
    }

    async function api(path, init) {
      var baseUrl = document.getElementById("baseUrl");
      var base = baseUrl.value.replace(/\/$/, "");
      var url = base + path;
      var method = (init?.method || "GET").toUpperCase();
      var startedAt = performance.now();
      log(`HTTP ${method} ${url}`);

      var res = await fetch(url, init);
      var elapsedMs = Math.round(performance.now() - startedAt);
      var text = await res.text();

      var json = null;
      if (text) {
        try { json = JSON.parse(text); } catch { json = null; }
      }

      if (json !== null) {
        log(`HTTP ${method} ${url} -> ${res.status} (${elapsedMs}ms)`, json);
      } else {
        log(`HTTP ${method} ${url} -> ${res.status} (${elapsedMs}ms)`);
      }

      if (!res.ok) {
        var message = json?.error ?? text ?? res.statusText;
        throw new Error(`[${res.status}] ${message}`);
      }

      return json;
    }

    function requireSelectedSession() {
      if (!state.sessionId) throw new Error("session is not selected");
      return state.sessionId;
    }

    async function refreshSessions() {
      var result = await api("/sessions", { method: "GET", headers: authOnlyHeaders() });
      state.sessions = Array.isArray(result) ? result : [];

      var sessionSelect = document.getElementById("sessionSelect");
      if (sessionSelect) {
        var keep = state.sessionId;
        sessionSelect.innerHTML = "";

        var empty = document.createElement("option");
        empty.value = "";
        empty.textContent = state.sessions.length ? "(select a session)" : "(no sessions)";
        sessionSelect.appendChild(empty);

        for (var s of state.sessions) {
          var opt = document.createElement("option");
          opt.value = s.session_id;
          opt.textContent = `${s.session_id} | ${s.username}@${s.host}:${s.port} | owner=${s.owner} | clients=${s.client_count}`;
          sessionSelect.appendChild(opt);
        }

        if (keep && state.sessions.some(s => s.session_id === keep)) {
          setSessionId(keep);
        } else {
          setSessionId("");
        }
      }

      log("sessions refreshed", { count: state.sessions.length });
    }

    function mountTerminal({ containerEl, host, url, readonly, onResize, onStatus }) {
      if (!containerEl) return;
      containerEl.innerHTML = "";

      var term = document.createElement("dm-ssh-terminal");
      if (host) term.setAttribute("host", host);
      if (url) term.setAttribute("url", url);
      if (readonly) term.setAttribute("readonly", "");

      term.addEventListener("dm-ssh-terminal:resize", ev => {
        onResize?.({ cols: ev.detail?.cols, rows: ev.detail?.rows });
      });

      term.addEventListener("dm-ssh-terminal:status", ev => {
        onStatus?.(ev.detail?.status || "idle");
      });

      containerEl.appendChild(term);
    }
  </script>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-title">SSH Broker</div>

    <div class="section">
      <div class="section-title">Broker</div>
      <label>REST Base URL
        <input id="baseUrl" value="">
      </label>
      <label>Auth Token
        <input id="authToken" value="dev-token">
      </label>
    </div>

    <div class="section">
      <div class="section-title">SSH Target</div>
      <label>Host <input id="host" value="127.0.0.1"></label>
      <div class="two">
        <label>Port <input id="port" type="number" value="22"></label>
        <label>TTL (sec) <input id="ttl" type="number" value="90"></label>
      </div>
      <label>Username <input id="username" value="demo"></label>
      <label>Password <input id="password" type="password" value="demo-password"></label>
    </div>

    <div class="section buttons">
      <button id="healthBtn" class="ghost">1. Health Check
        <script>
          document.currentScript.parentElement.addEventListener("click", async () => {
            const result = await api("/healthz", { method: "GET" });
            log("health", result);
          });
        </script>
      </button>
      <button id="refreshBtn" class="ghost">2. Refresh Session List
        <script>
          document.currentScript.parentElement.addEventListener("click", async () => {
            await refreshSessions();
          });
        </script>
      </button>
      <button id="createBtn">3. Create + Attach Writer
        <script>
          const portInput = document.getElementById("port");
          const usernameInput = document.getElementById("username");
          const passwordInput = document.getElementById("password");

          document.currentScript.parentElement.addEventListener("click", async () => {
            const st = state;

            setSessionId("");
            clearTerminal(writerContainer);
            clearTerminal(readonlyContainer);
            setStatus(writerStatus, "creating...", "");
            setStatus(readonlyStatus, "idle", "");

            const result = await api("/sessions", {
              method: "POST",
              headers: authHeaders(),
              body: JSON.stringify({
                host: hostInput.value.trim(),
                port: Number(portInput.value),
                username: usernameInput.value.trim(),
                password: passwordInput.value,
                pty_cols: st.writerSize?.cols ?? 120,
                pty_rows: st.writerSize?.rows ?? 40,
              }),
            });

            st.sessionId = result.session_id;
            log("session created", result);
            mountTerminal({
              containerEl: writerContainer,
              host: hostInput.value.trim(),
              url: result.writer_ws_url,
              onResize: size => { st.writerSize = size; },
              onStatus: status => setStatus(writerStatus, status, ""),
            });
            setStatus(writerStatus, "attached", "ok");

            await refreshSessions();
            setSessionId(result.session_id);
          });
        </script>
      </button>
      <button id="attachWriterBtn" class="secondary" disabled>4. Attach Writer to Selected
        <script>
          syncState(document.currentScript.parentElement);
          document.currentScript.parentElement.addEventListener("click", async () => {
            const st = state;
            const sessionId = requireSelectedSession();

            clearTerminal(writerContainer);
            const result = await api(`/sessions/${sessionId}/attach-tokens`, {
              method: "POST",
              headers: authHeaders(),
              body: JSON.stringify({ mode: "writer", ttl_seconds: Number(ttlInput.value) }),
            });

            log("writer token issued", result);
            mountTerminal({
              containerEl: writerContainer,
              host: hostInput.value.trim(),
              url: result.ws_url,
              onResize: size => { st.writerSize = size; },
              onStatus: status => setStatus(writerStatus, status, ""),
            });
            setStatus(writerStatus, "attached", "ok");

            await refreshSessions();
            setSessionId(sessionId);
          });
        </script>
      </button>
      <button id="readonlyBtn" class="secondary" disabled>5. Attach Readonly Mirror
        <script>
          syncState(document.currentScript.parentElement);
          document.currentScript.parentElement.addEventListener("click", async () => {
            const st = state;
            const sessionId = requireSelectedSession();

            clearTerminal(readonlyContainer);
            const result = await api(`/sessions/${sessionId}/attach-tokens`, {
              method: "POST",
              headers: authHeaders(),
              body: JSON.stringify({ mode: "readonly", ttl_seconds: Number(ttlInput.value) }),
            });

            log("readonly token issued", result);
            mountTerminal({
              containerEl: readonlyContainer,
              host: hostInput.value.trim(),
              url: result.ws_url,
              readonly: true,
              onResize: size => { st.readonlySize = size; },
              onStatus: status => setStatus(readonlyStatus, status, ""),
            });
            setStatus(readonlyStatus, "attached", "ok");

            await refreshSessions();
            setSessionId(sessionId);
          });
        </script>
      </button>
      <button id="resizeBtn" class="secondary" disabled>6. Sync Resize to PTY
        <script>
          syncState(document.currentScript.parentElement);
          document.currentScript.parentElement.addEventListener("click", async () => {
            const st = state;
            const sessionId = requireSelectedSession();
            if (!st.writerSize?.cols || !st.writerSize?.rows) {
              throw new Error("writer size event is not available yet (to be implemented in dm-ssh-terminal)");
            }

            const result = await api(`/sessions/${sessionId}/resize`, {
              method: "POST",
              headers: authHeaders(),
              body: JSON.stringify({ cols: st.writerSize.cols, rows: st.writerSize.rows }),
            });
            log(`resize -> ${st.writerSize.cols}x${st.writerSize.rows}`, result);
          });
        </script>
      </button>
      <button id="deleteBtn" class="ghost" disabled>7. Delete Selected Session
        <script>
          syncState(document.currentScript.parentElement);
          document.currentScript.parentElement.addEventListener("click", async () => {
            const st = state;
            const sessionId = requireSelectedSession();

            const result = await api(`/sessions/${sessionId}`, {
              method: "DELETE",
              headers: authOnlyHeaders(),
            });

            log("session deleted", result);
            setSessionId("");
            st.sessions = [];
            clearTerminal(writerContainer);
            clearTerminal(readonlyContainer);
            setStatus(writerStatus, "idle", "");
            setStatus(readonlyStatus, "idle", "");

            await refreshSessions();
          });
        </script>
      </button>
    </div>

    <div class="section">
      <div class="section-title">Sessions</div>
      <label>Selected Session
        <select id="sessionSelect">
          <option value="">(none)</option>
        </select>
        <script>
          const sessionSelect = document.currentScript.previousElementSibling;
          sessionSelect.addEventListener("change", () => {
            setSessionId(sessionSelect.value);
          });
          document.addEventListener("sessionchange", () => {
            sessionSelect.value = state.sessionId;
          });
        </script>
      </label>
      <button id="detailBtn" class="ghost" disabled>Show Selected Detail
        <script>
          syncState(document.currentScript.parentElement);
          document.currentScript.parentElement.addEventListener("click", async () => {
            const sessionId = requireSelectedSession();
            const result = await api(`/sessions/${sessionId}`, {
              method: "GET",
              headers: authOnlyHeaders(),
            });
            log("session detail", result);
          });
        </script>
      </button>
      <div class="hint">一覧取得後、ここからセッションを選んで attach/resize/delete を試せます。</div>
    </div>

    <div class="section">
      <div class="section-title">State</div>
      <pre id="metaLog" class="meta"></pre>
    </div>
  </aside>

  <main class="workspace">
    <div class="term-wrap">
      <div class="term-head">
        <strong>Writer Terminal</strong>
        <span id="writerStatus" class="status">idle</span>
      </div>
      <div id="writerContainer" class="xterm-container"></div>
    </div>

    <div class="divider"></div>

    <div class="term-wrap mirror">
      <div class="term-head">
        <strong>Readonly Mirror</strong>
        <span id="readonlyStatus" class="status">idle</span>
      </div>
      <div id="readonlyContainer" class="xterm-container"></div>
    </div>
  </main>

  <script>
    const writerContainer = document.getElementById("writerContainer");
    const readonlyContainer = document.getElementById("readonlyContainer");
    const writerStatus = document.getElementById("writerStatus");
    const readonlyStatus = document.getElementById("readonlyStatus");
    const hostInput = document.getElementById("host");
    const ttlInput = document.getElementById("ttl");

    document.getElementById("baseUrl").value = window.location.origin;
    writerContainer.textContent = "Create or attach a session to mount dm-ssh-terminal.";
    readonlyContainer.textContent = "Attach readonly token to mount dm-ssh-terminal mirror.";
    log("ready");
    refreshSessions();
  </script>
</body>
</html>
