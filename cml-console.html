<!doctype html>
<html>

<head>
  <style>
    :root {
      color-scheme: dark;
    }
  </style>
</head>

<body>
  <div id="term"></div>
  <script type="module">
    import { Terminal } from "https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.mjs"
    const cssUrl = "https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css"
    const cssText = await fetch(cssUrl).then(r => r.text())
    const xtermCss = new CSSStyleSheet()
    await xtermCss.replace(cssText)
    document.adoptedStyleSheets = [...document.adoptedStyleSheets, xtermCss]

    const term = new Terminal()
    term.open(document.getElementById('term'))
    term.write('Hello from xterm.js')

    const token = await fetch('https://cml.danmaid.com/api/v0/authenticate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: 'admin', password: 'kanikani' }),
    }).then(r => r.json())
    const key = await fetch('https://cml.danmaid.com/api/v0/labs/2b13e418-8c52-470f-b31f-b29261e8e094/nodes/6dca4717-0b6c-411b-bc5d-d3ad5fb53c25/keys/console?line=0', {
      headers: { Authorization: `Bearer ${token}` }
    }).then(r => r.json())
    // const ws = new WebSocket(`wss://cml.danmaid.com/ws/dispatch/frontend/console?cml_client=WebUI&action=lab_exec&uuid=${key}`)
    const ws = new WebSocket(`wss://cml.danmaid.com/ws/dispatch/frontend/console?uuid=${key}`)
    ws.binaryType = 'arraybuffer'
    ws.addEventListener('open', () => console.log('WebSocket connection opened'))
    ws.addEventListener('message', (e) => console.log('Received message:', e.data))
    ws.addEventListener('close', () => console.log('WebSocket connection closed'))
    ws.addEventListener('error', (e) => console.error('WebSocket error:', e))

    ws.addEventListener('open', () => ws.send(JSON.stringify({ token })))
    ws.addEventListener('message', (e) => term.write(e.data instanceof ArrayBuffer ? new Uint8Array(e.data) : e.data))
    term.onData(data => ws.send(data))
  </script>
</body>

</html>
