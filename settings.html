<!doctype html>
<html lang="ja">

<head>
  <style>
    :root {
      color-scheme: dark;
    }
  </style>
  <script src="js/dm-auth.js"></script>
</head>

<body>
  <dm-auth></dm-auth>
  <form>
    <fieldset>
      <legend>CML</legend>
      <label>username: <input type="text" id="user" autocomplete="username"></label>
      <label>password: <input type="password" id="pass" autocomplete="current-password"></label>
      <button>Save
        <script>
          document.currentScript.parentElement.addEventListener('click', () => {
            const username = document.querySelector('#user').value
            const password = document.querySelector('#pass').value
            const cml = { username, password }
            credentials.set('cml', JSON.stringify(cml))
            alert('Credentials saved')
          })
        </script>
      </button>
    </fieldset>
  </form>
</body>

</html>
