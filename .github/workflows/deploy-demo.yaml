name: deploy-demo

on:
  push:
    branches: [ main ]
    paths:
      - 'demo/**'

jobs:
  deploy:
    runs-on: [self-hosted]

    steps:
      - uses: actions/checkout@v4

      - name: sync files
        run: |
          rsync -av --delete demo/ /var/www/demo.labo.danmaid.com/html/
