<!doctype html>
<html>

<head>
  <style>
    :root {
      color-scheme: dark;
    }

    th {
      text-align: start;
    }

    th,
    td {
      border-right: 1px solid;
      border-bottom: 1px solid;
      white-space: nowrap;
    }
  </style>
  <link rel="stylesheet" href="css/full-screen.css">
  <script src="js/dm-windows.js"></script>
  <script type="module" src="js/dm-terminal.mjs"></script>
</head>

<body class="full-screen" style="padding: 8px; display: flex; flex-direction: column;">
  <div style="flex: 1; overflow: auto;">
    <table>
      <thead style="position: sticky; top: 0; background-color: canvas;">
        <tr>
          <th>Title</th>
          <th>Service</th>
          <th>Hostname</th>
          <th>IPv4</th>
          <th>IPv6</th>
        </tr>
      </thead>
      <tbody>
        <template>
          <tr>
            <td data-text="title"></td>
            <td><dm-service data-bind></dm-service></td>
            <td><dm-hostname data-bind></dm-hostname></td>
            <td><dm-ip data-bind family="ipv4"></dm-ip></td>
            <td><dm-ip data-bind family="ipv6"></dm-ip></td>
          </tr>
        </template>
        <template id="cml">
          <tr>
            <td data-text="label"></td>
            <td data-text="cml"></td>
            <td data-text="state"></td>
            <td data-text="lab_id"></td>
            <td data-text="lab.lab_title"></td>
            <td data-text="i"></td>
            <td id="console"></td>
          </tr>
        </template>
        <template id="sdwan">
          <tr>
            <td data-text="host-name"></td>
            <td data-text="status"></td>
            <td data-text="site-name"></td>
            <td data-text="device-model"></td>
            <td data-text="version"></td>
            <td data-text="uuid"></td>
            <td id="console"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
  <div style="display: flex; flex-wrap: wrap;">
    <fieldset style="flex: 0 0 auto;">
      <legend>cml.danmaid.com</legend>
      <label>Username: <input type="text" name="username"></label>
      <label>Password: <input type="password" name="password"></label>
      <button>Save</button>
      <script>
        {
          const fieldset = document.currentScript.parentElement
          const legend = fieldset.querySelector('legend')
          const usernameInput = fieldset.querySelector('input[name="username"]')
          const passwordInput = fieldset.querySelector('input[name="password"]')
          const cml = new URL(`https://${legend.textContent}`)
          fieldset.querySelector('button').addEventListener('click', () => {
            localStorage.setItem(`credentials/${cml}/username`, usernameInput.value)
            localStorage.setItem(`credentials/${cml}/password`, passwordInput.value)
            location.reload()
          })
        }
      </script>
    </fieldset>
    <fieldset style="flex: 0 0 auto;">
      <legend>cml2.danmaid.com</legend>
      <label>Username: <input type="text" name="username"></label>
      <label>Password: <input type="password" name="password"></label>
      <button>Save</button>
      <script>
        {
          const fieldset = document.currentScript.parentElement
          const legend = fieldset.querySelector('legend')
          const usernameInput = fieldset.querySelector('input[name="username"]')
          const passwordInput = fieldset.querySelector('input[name="password"]')
          const cml = new URL(`https://${legend.textContent}`)
          fieldset.querySelector('button').addEventListener('click', () => {
            localStorage.setItem(`credentials/${cml}/username`, usernameInput.value)
            localStorage.setItem(`credentials/${cml}/password`, passwordInput.value)
            location.reload()
          })
        }
      </script>
    </fieldset>
    <fieldset style="flex: 0 0 auto;">
      <legend>cml3.danmaid.com</legend>
      <label>Username: <input type="text" name="username"></label>
      <label>Password: <input type="password" name="password"></label>
      <button>Save</button>
      <script>
        {
          const fieldset = document.currentScript.parentElement
          const legend = fieldset.querySelector('legend')
          const usernameInput = fieldset.querySelector('input[name="username"]')
          const passwordInput = fieldset.querySelector('input[name="password"]')
          const cml = new URL(`https://${legend.textContent}`)
          fieldset.querySelector('button').addEventListener('click', () => {
            localStorage.setItem(`credentials/${cml}/username`, usernameInput.value)
            localStorage.setItem(`credentials/${cml}/password`, passwordInput.value)
            location.reload()
          })
        }
      </script>
    </fieldset>
    <fieldset style="flex: 0 0 auto;">
      <legend>manager.sdwan.danmaid.com</legend>
      <label>Username: <input type="text" name="username"></label>
      <label>Password: <input type="password" name="password"></label>
      <button>Save</button>
      <script>
        {
          const fieldset = document.currentScript.parentElement
          const legend = fieldset.querySelector('legend')
          const usernameInput = fieldset.querySelector('input[name="username"]')
          const passwordInput = fieldset.querySelector('input[name="password"]')
          const sdwan = `https://${legend.textContent}`
          fieldset.querySelector('button').addEventListener('click', () => {
            localStorage.setItem(`credentials/${sdwan}/username`, usernameInput.value)
            localStorage.setItem(`credentials/${sdwan}/password`, passwordInput.value)
            location.reload()
          })
        }
      </script>
    </fieldset>
  </div>
  <script>
    {
      const template = document.querySelector('template#sdwan')
      const tbody = template.parentElement
      // Cisco SD-WAN Manager 20.15
      const sdwan = 'https://manager.sdwan.danmaid.com'
      const username = localStorage.getItem(`credentials/${sdwan}/username`)
      const password = localStorage.getItem(`credentials/${sdwan}/password`)
      if (!username || !password) throw new Error(`Credentials for ${sdwan} is not found in localStorage. Please set them first.`)
      fetch(sdwan + '/dataservice/client/token', { credentials: 'include' }).then(async r => {
        if (r.ok) return r.text()
        await fetch(sdwan + '/j_security_check', {
          method: 'POST',
          credentials: 'include',
          body: new URLSearchParams({ j_username: username, j_password: password }),
        })
        return fetch(sdwan + '/dataservice/client/token', { credentials: 'include' })
          .then(r => r.text())
      }).then(async token => {
        console.log(`Authenticated to ${sdwan} with token: ${token}`)
        const devices = await fetch(sdwan + '/dataservice/device', {
          credentials: 'include',
          headers: { 'X-XSRF-TOKEN': token }
        }).then(r => r.json())
        console.log(`Devices from ${sdwan}:`, devices)
        for (const device of devices.data) {
          const fragment = template.content.cloneNode(true)
          for (const el of fragment.querySelectorAll('[data-bind]')) {
            el.data = device
          }
          for (const el of fragment.querySelectorAll('[data-text]')) {
            const key = el.getAttribute('data-text')
            const value = key?.split('.').reduce((o, k) => o?.[k], device)
            if (value != null) el.textContent = value
          }
          tbody.appendChild(fragment)
        }
      })
    }


    const cmlTemplate = document.querySelector('template#cml')
    const cmlTbody = cmlTemplate.parentElement
    cmlTemplate.remove()
    for (const cml of ['cml', 'cml2', 'cml3'].map(v => new URL(`https://${v}.danmaid.com`))) {
      const username = localStorage.getItem(`credentials/${cml}/username`)
      const password = localStorage.getItem(`credentials/${cml}/password`)
      if (!username || !password) continue
      fetch(cml + '/api/v0/authenticate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      }).then(async r => {
        const token = await r.json()
        const nodes = await fetch(cml + '/api/v0/nodes', {
          headers: { 'Authorization': `Bearer ${token}` }
        }).then(r => r.json())
        console.log(nodes)
        const labs = new Map()
        let i = 0
        for (const item of nodes) {
          item.cml = cml.host
          item.i = i++
          let lab = labs.get(item.lab_id)
          if (!lab) {
            lab = await fetch(cml + `/api/v0/labs/${item.lab_id}`, {
              headers: { 'Authorization': `Bearer ${token}` }
            }).then(r => r.json())
            labs.set(item.lab_id, lab)
          }
          item.lab = lab

          const fragment = cmlTemplate.content.cloneNode(true)
          for (const el of fragment.querySelectorAll('[data-bind]')) {
            el.data = item
          }
          for (const el of fragment.querySelectorAll('[data-text]')) {
            const key = el.getAttribute('data-text')
            const value = key?.split('.').reduce((o, k) => o?.[k], item)
            if (value != null) el.textContent = value
          }

          // console
          const consoleTd = fragment.querySelector('#console')
          if (item.serial_consoles) for (const serial of item.serial_consoles) {
            const { console_key, label } = serial
            const button = document.createElement('button')
            button.textContent = label
            button.addEventListener('click', async () => {
              const ws = new WebSocket(`wss://${cml.host}/ws/dispatch/frontend/console?uuid=${console_key}`)
              ws.binaryType = 'arraybuffer'
              ws.addEventListener('open', () => ws.send(JSON.stringify({ token })))
              await new Promise(resolve => ws.addEventListener('open', () => resolve(), { once: true }))
              const term = document.createElement('dm-terminal')
              ws.addEventListener('message', (e) => term.write(e.data instanceof ArrayBuffer ? new Uint8Array(e.data) : e.data))
              term.onData(data => ws.send(data))
              const windows = document.querySelector('dm-windows')
              windows.open(term, { title: `${item.label} ${label}` })
            })
            consoleTd.appendChild(button)
          }

          cmlTbody.appendChild(fragment)
        }
      })
    }

    /**
           * @typedef {Object} Item
           * @property {string} title
           * @property {string} hostname
           * @property {{ family: "IPv4" | "IPv6", address: string }[]} addresses
           * @property {{ protocol: string, service?: string, port?: number }[]} listeners
           */
    const url = 'test.json'
    fetch(url).then(async r => {
      /** @type {Item[]} */
      const items = await r.json()
      const template = document.querySelector('template')
      for (const item of items) {
        const fragment = template.content.cloneNode(true)
        for (const el of fragment.querySelectorAll('[data-text]')) {
          const key = el.getAttribute('data-text')
          const value = key?.split('.').reduce((o, k) => o?.[k], item)
          if (value != null) el.textContent = value
        }
        for (const el of fragment.querySelectorAll('[data-bind]')) {
          el.data = item
        }
        template.parentElement.appendChild(fragment)
      }
      template.remove()
    })

    class DmBindable extends HTMLElement {
      set data(data) {
        this._data = data
        this.render()
      }
      get data() { return this._data }
      constructor() {
        super()
        this.render()
      }

      render() { }
    }

    customElements.define('dm-service', class extends DmBindable {
      get services() {
        return this.data.listeners?.map(l => l.service || l.protocol || l.port)
      }
      render() {
        this.textContent = this.services
      }
    })

    customElements.define('dm-ip', class extends DmBindable {
      get family() {
        return this.getAttribute('family').toLowerCase()
      }
      get addresses() {
        return this.data.addresses?.filter(v => v.family.toLowerCase() === this.family)
          .map(v => v.address)
      }
      get listeners() {
        return this.data.listeners
      }
      getLinks(addr) {
        const a = this.family === 'ipv6' ? `[${addr}]` : addr
        return this.listeners.map(v => `<a href="${v.protocol}://${a}:${v.port}" target="_blank">${v.service}</a>`)
      }
      render() {
        this.innerHTML = this.addresses?.map(v => `<div>${v} ${this.getLinks(v)}</div>`).join('')
      }
    })

    customElements.define('dm-hostname', class extends DmBindable {
      get hostname() {
        return this.data.hostname
      }
      get listeners() {
        return this.data.listeners
      }
      get links() {
        return this.listeners.map(v => `<a href="${v.protocol}://${this.hostname}:${v.port}" target="_blank">${v.service}</a>`)
      }
      render() {
        this.innerHTML = `<div>${this.hostname}${this.links}</div>`
      }
    })

  </script>
  <dm-windows></dm-windows>
  <div style="position: absolute; top: 0; right: 0; background: #FF0000A0; width: 200px; height: 100%">Window Manager
  </div>
</body>

</html>
