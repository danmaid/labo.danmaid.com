<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="css/full-screen.css">
  <style>
    :root {
      color-scheme: dark;
    }

    iframe {
      box-sizing: border-box;
    }

    .grid {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
    }

    .grid>* {
      width: 100%;
      height: 100%;
    }
  </style>
  <script src="js/credentials.js"></script>
  <script src="js/dm-window.js"></script>
</head>

<body class="full-screen">
  <div>
    <dm-window>
      <dm-terminal io="ws://localhost:8080/ssh"></dm-terminal>
    </dm-window>
  </div>
  <script type="module">
    import { Terminal } from './vendor/xterm/xterm.mjs'
    import { FitAddon } from './vendor/xterm/addon-fit.mjs'
    const cssText = await fetch('./vendor/xterm/xterm.css').then(r => r.text())
    const css = new CSSStyleSheet()
    await css.replace(cssText)
    await css.insertRule(`
      :host {
        display: block;
        width: 100%;
        height: 100%;
      }`)

    class DmTerminal extends HTMLElement {
      xterm = new Terminal()
      constructor() {
        super()
        const shadow = this.attachShadow({ mode: 'open' })
        shadow.adoptedStyleSheets = [...shadow.adoptedStyleSheets, css]
        const fit = new FitAddon()
        this.fit = fit
        this.xterm.loadAddon(fit)
        this.xterm.open(this)
        // 80x24 に必要なピクセルサイズを取得
        console.log({ xterm: this.xterm })
        const core = this.xterm._core
        console.log({ core })
        const dims = core._renderService.dimensions
        console.log({ dims })

        const cw = dims.actualCellWidth
        const ch = dims.actualCellHeight
        console.log({ cw, ch })
        // // Element のサイズを調整
        // const el = document.getElementById('terminal')
        // el.style.width = dims.width + 'px'
        // el.style.height = dims.height + 'px'

        // その後、fit() で反映
        fit.fit()

        new ResizeObserver(() => fit.fit()).observe(this)
      }
      connectedCallback() {
        const core = this.xterm._core
        console.log('cc', { core })
        const dims = core._renderService.dimensions
        console.log('cc', { dims })

        const cw = dims.actualCellWidth
        const ch = dims.actualCellHeight
        console.log('cc', { cw, ch })
      }
    }
    customElements.define('dm-terminal', DmTerminal)
    document.createElement('dm-terminal')
  </script>
  <dm-window-manager class="full-screen" style="display: flex;">
    <script>
      customElements.define('dm-window-manager', class extends HTMLElement {
        constructor() {
          super()
          const overlay = document.createElement('div')
          overlay.style.position = 'absolute'
          overlay.style.inset = 0
          overlay.style.zIndex = 1000
          overlay.style.pointerEvents = 'none'
          overlay.style.overflow = 'hidden'
          this.appendChild(overlay)
          this.addEventListener('click', (e) => {
            if (e.target.target === 'dm-window') {
              e.preventDefault()
              const win = document.createElement('dm-window')
              win.style.pointerEvents = 'auto'
              win.setAttribute('title', e.target.textContent)
              win.setAttribute('url', e.target.href)
              overlay.appendChild(win)
            }
          })
        }
      })
    </script>
    <div style="flex: 0 0 200px;">
      <div>nodes</div>
      <ul>
        <li><a target="dm-window" data-cml="https://cml.danmaid.com" data-lab="cd24ee6f-d8e7-46ef-96ee-92616387360a"
            data-node="6dca4717-0b6c-411b-bc5d-d3ad5fb53c25">Lab 1</a></li>
        <li><a href="https://cml2.danmaid.com/lab/0313c28f-990b-45ca-97d3-404ec36e27be" target="dm-window">Lab 2</a>
        </li>
        <li><a href="https://cml3.danmaid.com/lab/9bdb554d-d378-47e6-af3e-0162e99b4a02" target="dm-window">Lab 3</a>
        </li>
        <li><a href="https://cml4.danmaid.com/lab/01354126-65ee-499b-b015-8700e654ef6c" target="dm-window">Lab 4</a>
        </li>
      </ul>
    </div>
    <div class="grid">
      <iframe src="https://cml.danmaid.com/lab/cd24ee6f-d8e7-46ef-96ee-92616387360a"></iframe>
      <iframe src="https://cml2.danmaid.com/lab/0313c28f-990b-45ca-97d3-404ec36e27be"></iframe>
      <iframe src="https://cml3.danmaid.com/lab/9bdb554d-d378-47e6-af3e-0162e99b4a02"></iframe>
      <iframe src="https://cml4.danmaid.com/lab/01354126-65ee-499b-b015-8700e654ef6c"></iframe>
    </div>
  </dm-window-manager>
</body>

</html>
