<!doctype html>
<html lang="ja">

<head>
  <style>
    :root {
      color-scheme: dark;
    }

    [data-count]::after {
      content: attr(data-count);
    }

    textarea {
      font-family: monospace;
      white-space: pre;
    }
  </style>
  <script src="js/dm-sdwan.js"></script>
  <script src="js/dm-catc.js"></script>
  <script src="js/dm-regexp-filter.js"></script>
</head>

<body>
  <fieldset>
    <legend>SD-WAN</legend>
    <dm-sdwan id="sdwan" manager="https://manager.sdwan.danmaid.com"></dm-sdwan>
    <button>load
      <script>
        document.currentScript.parentElement.addEventListener('click', async function () {
          this.disabled = true
          const { data } = await sdwan.fetch('/device').then(r => r.json())
          table.value = await Promise.all(data.map(async v => {
            const { config } = await sdwan.fetch('/template/config/attached/' + v.uuid + '?type=RFS')
              .then(r => r.json())
            const summary = config?.startsWith('no config') ? 'no config' : config.split('\n').length + ' lines'
            const item = { ...v, config, 'config-summary': summary }
            insertRow(item)
            return item
          }))
          this.disabled = false
        })
      </script>
    </button>
  </fieldset>

  <fieldset>
    <legend>Catalyst Center</legend>
    <dm-catc id="catc" server="https://catc.danmaid.com"></dm-catc>
    <button>load
      <script>
        document.currentScript.parentElement.addEventListener('click', async function () {
          this.disabled = true
          // const { response } = await catc.fetch('/dna/intent/api/v1/network-device?hostname=.*CRT.*').then(r => r.json())
          const { response } = await catc.fetch('/dna/intent/api/v1/network-device').then(r => r.json())
          table.value = await Promise.all(response.map(async v => {
            const { response: { url } } = await catc.fetch('/dna/intent/api/v1/network-device-poller/cli/read-request', {
              method: 'POST',
              body: JSON.stringify({
                commands: ['show running-config'],
                deviceUuids: [v.id]
              })
            }).then(r => r.json())
            let fileId
            for (let i = 0; i < 600; i++) {
              const { response } = await catc.fetch('/dna/intent' + url).then(r => r.json())
              console.log(response)
              try {
                const result = JSON.parse(response.progress)
                console.log(result)
                fileId = result.fileId
                break
              } catch {
                await new Promise(r => setTimeout(r, 1000))
              }
            }
            if (!fileId) throw new Error('Timeout while waiting for config')
            const r = await catc.fetch('/dna/intent/api/v1/file/' + fileId).then(r => r.json())
            const config = r[0]?.commandResponses?.SUCCESS['show running-config'] || 'no config'
            const summary = config?.startsWith('no config') ? 'no config' : config.split('\n').length + ' lines'
            const item = { ...v, config, 'config-summary': summary, uuid: v.id, 'system-ip': v.managementIpAddress, 'host-name': v.hostname }
            console.log(item)
            insertRow(item)
            return item
          }))
          this.disabled = false
        })
      </script>
    </button>
  </fieldset>

  <table id="table">
    <thead>
      <tr>
        <th>UUID</th>
        <th>System IP</th>
        <th>hostname</th>
        <th>config</th>
        <td><button>+
            <script>
              let matches = 0
              const td = document.currentScript.closest('td')
              document.currentScript.parentElement.addEventListener('click', (ev) => {
                const index = td.cellIndex
                td.insertAdjacentHTML('beforebegin', `<th>match${matches}</th>`)
                console.log(td.cellIndex)
                /** @type {HTMLTableRowElement} */
                const filters = document.querySelector('tr#filters')
                const filter = filters.insertCell(index)
                const input = document.createElement('dm-regexp-filter')
                input.setAttribute('data-key', `match${matches}`)
                input.setAttribute('ignore', '')
                input.addEventListener('input', (e) => {
                  e.stopPropagation()
                  let count = 0, total = 0
                  for (const row of table.querySelectorAll('tr[data-bind]')) {
                    const td = row.cells[index]
                    const item = row.value
                    const regex = new RegExp(input.value, 'gm')
                    const match = Array.from(item.config.matchAll(regex))
                    console.log(regex, match)
                    item[input.getAttribute('data-key')] = match
                    td.replaceChildren()
                    for (const m of match) {
                      td.insertAdjacentHTML('beforeend', `<details>
                        <summary>${m[1]}</summary>
                        <textarea cols="80" rows="${Math.min(24, m[0].split('\n').length)}" readonly>${m[0]}</textarea>
                      </details>`)
                    }
                    if (match.length > 0) count++
                    total++
                  }
                  filter.setAttribute('data-count', `${count}/${total}`)
                })
                filter.appendChild(input)

                console.log(rowTemplate)
                const cell = rowTemplate.content.querySelector('tr').insertCell(index)
                cell.textContent = 'TBD by Template'
                for (const row of tbody.querySelectorAll('tr[data-bind]')) {
                  const cell = row.insertCell(index)
                  cell.textContent = 'TBD'
                }
                matches++
              })
            </script>
          </button></td>
        <td>
          <button>clear
            <script>document.currentScript.parentElement.addEventListener('click', () => tbody.replaceChildren())</script>
          </button>
          <button>export
            <script>
              document.currentScript.parentElement.addEventListener('click', () => {
                const items = Array.from(table.querySelectorAll('tr[data-bind]'))
                  .filter(v => v.style.display !== 'none').map(v => v.value)
                console.log('Exporting data', items)
                const blob = new Blob([JSON.stringify(items)], { type: 'application/json' })
                const url = URL.createObjectURL(blob)
                const a = document.createElement('a')
                a.href = url
                a.download = 'export.json'
                a.click()
                URL.revokeObjectURL(url)
              })
            </script>
          </button>
        </td>
      </tr>
      <tr id="filters">
        <td><dm-regexp-filter data-key="uuid"></dm-regexp-filter></td>
        <td><dm-regexp-filter data-key="system-ip"></dm-regexp-filter></td>
        <td><dm-regexp-filter data-key="host-name"></dm-regexp-filter></td>
        <td><dm-regexp-filter data-key="config"></dm-regexp-filter></td>
        <script>
          document.currentScript.parentElement.addEventListener('input', (e) => {
            const filters = Array.from(table.querySelectorAll('dm-regexp-filter'))
              .filter(v => !v.hasAttribute('ignore')).map(v => v.filter)
            let count = 0, total = 0
            for (const row of table.querySelectorAll('tr[data-bind]')) {
              if (filters.some(fn => !fn(row.value))) {
                row.style.display = 'none'
              } else {
                row.style.display = ''
                count++
              }
              total++
            }
            e.target.closest('td')?.setAttribute('data-count', `${count}/${total}`)
          })
        </script>
      </tr>
    </thead>
    <tbody id="tbody">
      <template>
        <tr data-bind>
          <td data-text="uuid"></td>
          <td data-text="system-ip"></td>
          <td data-text="host-name"></td>
          <td>
            <details>
              <summary>
                <span data-text="config-summary"></span>
              </summary>
              <textarea data-text="config" cols="80" rows="24" readonly></textarea>
            </details>
          </td>
        </tr>
      </template>
      <script>
        const rowTemplate = document.currentScript.previousElementSibling
        const tbody = rowTemplate.parentElement
        function insertRow(item) {
          const row = rowTemplate.content.cloneNode(true)
          for (const el of row.querySelectorAll('[data-bind]')) el.value = item
          for (const el of row.querySelectorAll('[data-text]')) {
            const key = el.getAttribute('data-text')
            if (item[key]) el.textContent = item[key]
          }
          tbody.appendChild(row)
        }
      </script>
    </tbody>
  </table>
</body>

</html>
